server {
  listen 8080;

  root   /usr/share/nginx/html;
  index  index.html index.htm;
  include /etc/nginx/mime.types;

  # BACKEND_HOST_PLACEHOLDER is replaced at image build with the backend
  # Cloud Run hostname (no scheme), e.g. svc-12345.us-central1.run.app
  location /api/ {
    proxy_pass https://BACKEND_HOST_PLACEHOLDER;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host BACKEND_HOST_PLACEHOLDER;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forward IAP identity so the backend can verify the user.
    proxy_set_header X-Goog-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
    proxy_set_header X-Goog-Authenticated-User-Email $http_x_goog_authenticated_user_email;
    proxy_set_header X-Goog-Authenticated-User-Id $http_x_goog_authenticated_user_id;
    proxy_set_header X-Goog-Authenticated-User-Name $http_x_goog_authenticated_user_name;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
