steps:
  # 1. Inject build-time Angular config (IAP client id for logout redirect)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|IAP_CLIENT_ID_PLACEHOLDER|$${IAP_CLIENT_ID}|g" src/environments/environment.prod.ts
    dir: frontend
    secretEnv:
      - IAP_CLIENT_ID

  # 2. Build frontend container (nginx serves SPA and proxies /api)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env: ['DOCKER_BUILDKIT=1']
    args:
      [
        'build',
        '--build-arg',
        'BACKEND_HOST=${_BACKEND_HOST}',
        '-t',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
        '.',
      ]
    dir: frontend
    waitFor: ['Inject Environment Variables']

  # 3. Push image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
      ]
    waitFor: ['Build']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--quiet'
    waitFor: ['Push']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/IAP_CLIENT_ID/versions/latest
      env: IAP_CLIENT_ID

substitutions:
  _SERVICE_NAME: 'cstudio-frontend-dev'
  _REPO_NAME: 'cs-fe-development-repo'
  _REGION: 'us-central1'
  _BACKEND_HOST: 'localhost'

options:
  logging: CLOUD_LOGGING_ONLY
