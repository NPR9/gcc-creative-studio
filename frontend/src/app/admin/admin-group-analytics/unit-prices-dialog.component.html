<h2 mat-dialog-title class="dialog-title">Model unit prices</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-intro">
    Reference rates used to estimate spend. Sourced from public Google pricing;
    actual billing may differ.
  </p>

  <div *ngIf="isLoading" class="loading-wrap">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="errorMessage && !isLoading" class="error-banner">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage" class="table-wrap">
    <table mat-table [dataSource]="prices" class="prices-table">
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef>Model</th>
        <td mat-cell *matCellDef="let row" class="model-cell">{{ row.model }}</td>
      </ng-container>

      <ng-container matColumnDef="unitType">
        <th mat-header-cell *matHeaderCellDef>Unit</th>
        <td mat-cell *matCellDef="let row">
          {{ unitTypeLabel(row.unitType) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price (USD)</th>
        <td mat-cell *matCellDef="let row">{{ formatPrice(row) }}</td>
      </ng-container>

      <ng-container matColumnDef="notes">
        <th mat-header-cell *matHeaderCellDef>Notes</th>
        <td mat-cell *matCellDef="let row" class="notes-cell">
          {{ row.notes || '—' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
